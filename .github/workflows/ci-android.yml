name: Android CI

on:
  push:
    branches:
      - 'personal/android-stability-and-features'
    paths:
      - 'android/**'
      - 'root-module-manual/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: personal/android-stability-and-features
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      app_version: ${{ steps.version.outputs.app_version }}
      has_release_keystore: ${{ steps.keystore.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        id: keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_FILE" ]; then
            echo "$RELEASE_KEYSTORE_FILE" | base64 --decode > android/release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No RELEASE_KEYSTORE_FILE secret; FOSS artifacts will use debug signing."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"
      - name: Create local.properties
        if: github.event_name != 'pull_request' && steps.keystore.outputs.available == 'true'
        run: |
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
      - name: Build debug APK for PRs
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleFossDebug
        working-directory: android
      - name: Build release artifacts
        if: github.event_name != 'pull_request'
        run: ./gradlew packageReleaseArtifacts
        working-directory: android
      - name: Get app version
        id: version
        run: echo "app_version=$(grep 'appVersionName =' android/app/build.gradle.kts | sed 's/.*= "\(.*\)"/\1/')" >> $GITHUB_OUTPUT
      - id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: apk-release
          path: release/*release.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: apk-debug
          path: release/*debug.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: root-module-release
          path: release/*release.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: root-module-debug
          path: release/*debug.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-bundle
          path: release/*.aab
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts/apk-release

      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: artifacts/apk-debug

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: root-module-release
          path: artifacts/root-module-release

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: root-module-debug
          path: artifacts/root-module-debug
      - id: prev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // empty')

          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - id: changelog
        run: |
          REPO="${{ github.server_url }}/${{ github.repository }}"
          if [ -z "${{ steps.prev.outputs.tag }}" ]; then
            NOTES=$(git log --pretty=format:"- %s ([%h]($REPO/commit/%H))")
          else
            NOTES=$(git log ${{ steps.prev.outputs.tag }}..HEAD --pretty=format:"- %s ([%h]($REPO/commit/%H))" || git log --pretty=format:"- %s ([%h]($REPO/commit/%H))")
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: tag
        run: echo "tag=nightly-${{ needs.build.outputs.short_sha }}" >> $GITHUB_OUTPUT

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          ASSETS=(artifacts/**/*)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          gh release delete "${{ steps.tag.outputs.tag }}" --yes || true
          gh release create "${{ steps.tag.outputs.tag }}" \
            "${ASSETS[@]}" \
            -t "Nightly ${{ needs.build.outputs.short_sha }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            --prerelease
      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      - name: Post to Discord
        env:
          DISCORD_ANDROID_CI_URL: ${{ secrets.DISCORD_ANDROID_CI_URL }}
        if: env.DISCORD_ANDROID_CI_URL != ''
        run: |
          curl -X POST "${DISCORD_ANDROID_CI_URL}?with_components=true" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [
                {
                  "title": "LibrePods Nightly Build",
                  "description": "Download the latest debug and release APKs.",
                  "color": 253060,
                  "fields": [
                    {
                      "name": "Changelog",
                      "value": ${{ toJSON(steps.changelog.outputs.notes) }},
                      "inline": false
                    }
                  ],
                  "timestamp": "${{ steps.timestamp.outputs.timestamp }}",
                  "footer": {
                    "text": "GitHub Actions"
                  }
                }
              ],
              "components": [
                {
                  "type": 1,
                  "components": [
                    {
                      "type": 2,
                      "label": "Download Release APK",
                      "style": 5,
                      "url": "${{ github.server_url }}/${{ github.repository }}/releases/download/nightly-${{ needs.build.outputs.short_sha }}/LibrePods-FOSS-v${{ needs.build.outputs.app_version }}-release.apk"
                    },
                    {
                      "type": 2,
                      "label": "Download Debug APK",
                      "style": 5,
                      "url": "${{ github.server_url }}/${{ github.repository }}/releases/download/nightly-${{ needs.build.outputs.short_sha }}/LibrePods-FOSS-v${{ needs.build.outputs.app_version }}-debug.apk"
                    }
                  ]
                }
              ]
            }'
